<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Reset Password | R &amp; L Studio - Doha, Qatar</title>
    <meta
      name="description"
      content="Securely set your new account password for R &amp; L Studio. Powered by Supabase Authentication."
    />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN & Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              display: ['Outfit', 'sans-serif'],
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              brand: {
                blue: '#2563eb',
                dark: '#0f172a',
                emerald: '#059669',
              }
            }
          }
        }
      };
    </script>

    <!-- Global App Stylesheet -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-blue-600 selection:text-white">

    <!-- Header -->
    <header class="sticky top-0 z-40 header-glass">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16 sm:h-20">
          <a href="index.html" class="flex items-center gap-3 group">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold font-display shadow-md shadow-blue-500/20 group-hover:scale-105 transition-transform">
              R&amp;L
            </div>
            <div>
              <div class="brand-name font-bold font-display text-lg tracking-tight leading-none text-slate-900 dark:text-white">
                R &amp; L Studio
              </div>
              <div class="brand-subtitle text-[10px] font-mono tracking-wider text-slate-500 dark:text-slate-400 mt-0.5">
                Android Mobile Developer · Doha, Qatar
              </div>
            </div>
          </a>

          <div class="flex items-center gap-3">
            <!-- Theme Toggle -->
            <button
              id="themeToggle"
              type="button"
              aria-label="Toggle Theme"
              class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-slate-100 dark:hover:bg-slate-900 transition cursor-pointer"
            >
              <svg class="w-4 h-4 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
              </svg>
              <svg class="w-4 h-4 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
              </svg>
            </button>

            <a
              href="index.html"
              class="px-4 py-2 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition"
            >
              Back to Studio &rarr;
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Reset Password Container -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 py-12">
      <div class="max-w-md w-full bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 sm:p-8 shadow-xl">
        
        <div class="text-center mb-6">
          <div class="w-14 h-14 rounded-2xl bg-blue-600/10 text-blue-600 dark:text-blue-400 mx-auto flex items-center justify-center text-2xl mb-3 shadow-inner">
            <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </div>
          <h1 class="text-2xl font-bold font-display text-slate-900 dark:text-white">
            Set New Password
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
            Enter your new secure password for your R &amp; L Studio account.
          </p>
        </div>

        <!-- Feedback Notice -->
        <div id="resetFeedback" class="hidden p-3.5 rounded-xl text-xs font-medium mb-5"></div>

        <!-- Password Reset Form -->
        <form id="resetPasswordForm" class="space-y-4">
          <div>
            <label for="newPassword" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
              New Password
            </label>
            <div class="relative">
              <input
                id="newPassword"
                type="password"
                required
                minlength="6"
                placeholder="At least 6 characters"
                class="form-input text-xs pr-10 w-full"
              />
              <button
                id="toggleNewPassBtn"
                type="button"
                aria-label="Toggle password visibility"
                class="password-toggle-btn absolute inset-y-0 right-0 pr-3 flex items-center"
              >
                <svg id="eyeIcon1" class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <svg id="eyeOffIcon1" class="w-4 h-4 text-slate-400 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                </svg>
              </button>
            </div>
          </div>

          <div>
            <label for="confirmPassword" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
              Confirm New Password
            </label>
            <div class="relative">
              <input
                id="confirmPassword"
                type="password"
                required
                minlength="6"
                placeholder="Re-enter your new password"
                class="form-input text-xs pr-10 w-full"
              />
              <button
                id="toggleConfirmPassBtn"
                type="button"
                aria-label="Toggle confirm password visibility"
                class="password-toggle-btn absolute inset-y-0 right-0 pr-3 flex items-center"
              >
                <svg id="eyeIcon2" class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <svg id="eyeOffIcon2" class="w-4 h-4 text-slate-400 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                </svg>
              </button>
            </div>
          </div>

          <button
            id="resetSubmitBtn"
            type="submit"
            class="w-full py-3 px-4 rounded-xl text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-md transition cursor-pointer flex items-center justify-center gap-2"
          >
            Update Password
          </button>
        </form>

        <div class="mt-6 pt-5 border-t border-slate-200 dark:border-slate-800 text-center">
          <a
            href="index.html"
            class="text-xs font-semibold text-blue-600 dark:text-blue-400 hover:underline"
          >
            &larr; Return to Sign In / Home
          </a>
        </div>

      </div>
    </main>

    <!-- Scripts -->
    <script type="module">
      import { supabase } from './js/supabase.js';

      // Theme toggle
      const themeToggle = document.getElementById('themeToggle');
      const root = document.documentElement;
      if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        root.classList.add('dark');
      } else {
        root.classList.remove('dark');
      }
      themeToggle?.addEventListener('click', () => {
        root.classList.toggle('dark');
        localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
      });

      // Toggle Eye Buttons
      const newPassInput = document.getElementById('newPassword');
      const confirmPassInput = document.getElementById('confirmPassword');
      const toggleNewPassBtn = document.getElementById('toggleNewPassBtn');
      const toggleConfirmPassBtn = document.getElementById('toggleConfirmPassBtn');
      const eyeIcon1 = document.getElementById('eyeIcon1');
      const eyeOffIcon1 = document.getElementById('eyeOffIcon1');
      const eyeIcon2 = document.getElementById('eyeIcon2');
      const eyeOffIcon2 = document.getElementById('eyeOffIcon2');

      toggleNewPassBtn?.addEventListener('click', () => {
        if (newPassInput.type === 'password') {
          newPassInput.type = 'text';
          eyeIcon1.classList.add('hidden');
          eyeOffIcon1.classList.remove('hidden');
        } else {
          newPassInput.type = 'password';
          eyeIcon1.classList.remove('hidden');
          eyeOffIcon1.classList.add('hidden');
        }
      });

      toggleConfirmPassBtn?.addEventListener('click', () => {
        if (confirmPassInput.type === 'password') {
          confirmPassInput.type = 'text';
          eyeIcon2.classList.add('hidden');
          eyeOffIcon2.classList.remove('hidden');
        } else {
          confirmPassInput.type = 'password';
          eyeIcon2.classList.remove('hidden');
          eyeOffIcon2.classList.add('hidden');
        }
      });

      // Feedback helper
      const feedbackEl = document.getElementById('resetFeedback');
      const submitBtn = document.getElementById('resetSubmitBtn');

      function showFeedback(msg, type = 'info') {
        if (!feedbackEl) return;
        feedbackEl.textContent = msg;
        feedbackEl.className = 'p-3.5 rounded-xl text-xs font-medium mb-5';
        if (type === 'error') {
          feedbackEl.classList.add('bg-red-500/10', 'text-red-600', 'dark:text-red-400', 'border', 'border-red-500/20');
        } else if (type === 'success') {
          feedbackEl.classList.add('bg-emerald-500/10', 'text-emerald-600', 'dark:text-emerald-400', 'border', 'border-emerald-500/20');
        } else {
          feedbackEl.classList.add('bg-blue-500/10', 'text-blue-600', 'dark:text-blue-400', 'border', 'border-blue-500/20');
        }
        feedbackEl.classList.remove('hidden');
      }

      // Password Reset Form Submit Handler
      const form = document.getElementById('resetPasswordForm');
      form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const p1 = newPassInput?.value?.trim();
        const p2 = confirmPassInput?.value?.trim();

        if (!p1 || p1.length < 6) {
          showFeedback('Password must be at least 6 characters.', 'error');
          return;
        }

        if (p1 !== p2) {
          showFeedback('Passwords do not match. Please re-enter.', 'error');
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Updating Password...';
          showFeedback('Connecting to Supabase to update your password...', 'info');

          const { data, error } = await supabase.auth.updateUser({
            password: p1
          });

          if (error) {
            console.error('[Supabase updateUser Error]', error);
            console.log(error.message);
            showFeedback(error.message || 'Failed to update password. Recovery link may be expired.', 'error');
            return;
          }

          showFeedback('Password updated successfully! Redirecting to studio...', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } catch (err) {
          console.error('[Update Password Exception]', err);
          console.log(err?.message || err);
          showFeedback(err?.message || 'An unexpected error occurred while resetting password.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
        }
      });
    </script>
  </body>
</html>

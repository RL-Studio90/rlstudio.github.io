<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f2b46" />
    </linearGradient>

    <!-- Accent Halo Gradient -->
    <radialGradient id="haloGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Vector Icon Gradient -->
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Container Rounded Rect Background -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)" />
  <rect width="400" height="400" rx="36" fill="url(#haloGrad)" />

  <!-- Geometric Tech Pattern Background -->
  <circle cx="200" cy="180" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="6 8" />
  <circle cx="200" cy="180" r="95" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.2" />
  <circle cx="200" cy="180" r="60" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="3 6" />

  <!-- Modern Vector Architect / Developer Avatar Silhouette -->
  <g filter="url(#glow)">
    <!-- Avatar Head / Face Minimal Geometry -->
    <circle cx="200" cy="145" r="44" fill="url(#avatarGrad)" />
    
    <!-- Modern Tech Headset / Geometric Arc -->
    <path d="M 148 145 A 52 52 0 0 1 252 145" fill="none" stroke="#e0f2fe" stroke-width="5" stroke-linecap="round" />
    <rect x="144" y="138" width="8" height="18" rx="4" fill="#38bdf8" />
    <rect x="248" y="138" width="8" height="18" rx="4" fill="#38bdf8" />

    <!-- Shoulders / Torso Silhouette -->
    <path d="M 125 265 C 125 212 158 198 200 198 C 242 198 275 212 275 265 C 275 282 260 295 240 295 L 160 295 C 140 295 125 282 125 265 Z" fill="url(#avatarGrad)" />
  </g>

  <!-- Front Code / Engineering Emblems (Flutter/Android developer) -->
  <g transform="translate(145, 315)">
    <!-- Terminal Code Tag Pill -->
    <rect x="0" y="0" width="110" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    <text x="55" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
      &lt;DEV / ARCH&gt;
    </text>
  </g>

  <!-- Floating Tech Badges -->
  <!-- Left Badge: Flutter/Dart Code Chevron -->
  <g transform="translate(60, 115)">
    <rect width="44" height="44" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
    <path d="M 26 15 L 17 22 L 26 29" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right Badge: Mobile/Terminal Slash -->
  <g transform="translate(296, 115)">
    <rect width="44" height="44" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.3" />
    <path d="M 18 29 L 26 15" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Subtle Studio Corner Watermark -->
  <circle cx="340" cy="60" r="4" fill="#38bdf8" opacity="0.6" />
  <circle cx="355" cy="72" r="2.5" fill="#818cf8" opacity="0.4" />
  <circle cx="60" cy="330" r="3" fill="#34d399" opacity="0.5" />
</svg>
